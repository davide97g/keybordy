[project]
name = "keybordy-teaser-audio"
version = "0.1.0"
description = "Soundtrack for the keybordy MP teaser: music edit, cue sheet, synthesized SFX, mix and master"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "librosa>=0.10.2",
]

[tool.uv]
package = false
