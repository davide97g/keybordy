map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTML must be revalidated, or a cached copy without autoload.js is reused.
map $upstream_http_content_type $html_cache_control {
    ~text/html "no-cache";
    default    "";
}

server {
    listen 80;

    # autoload.js and the project files, never cached so edits show on reload.
    location /keybordy/ {
        alias /srv/keybordy/;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://velxio:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        client_max_body_size 50m;

        # sub_filter only sees uncompressed HTML.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script src="/keybordy/web/autoload.js" defer></script></head>';
        sub_filter_once on;
        add_header Cache-Control $html_cache_control;
    }
}
