<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velxio</title>
    <meta name="description" content="Local Arduino, ESP32 and RP2040 simulator (self-hosted Velxio fork)." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter.var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/JetBrainsMono.var.woff2" crossorigin />
  </head>
  <script>
    /* Theme bootstrap — runs before the first paint so a light-mode reader
       never gets a black flash (and a dark-mode reader never gets a white
       one). Deliberately duplicated from src/lib/theme.ts rather than
       imported: by the time a module has loaded, the page has painted.

       Contract: localStorage['velxio-theme'] = 'dark' | 'light' | 'system';
         unset  ->  dark, whatever the OS says. See src/lib/theme.ts. */
    (function () {
      try {
        var read = function (k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        };
        var mode = read('velxio-theme');
        if (mode !== 'dark' && mode !== 'light' && mode !== 'system') mode = 'dark';
        var resolved = mode;
        if (mode === 'system') {
          resolved =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', resolved === 'light' ? '#f5f5f7' : '#0a0a0c');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <body style="margin:0;background:var(--color-bg-canvas,#0a0a0c);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
