<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keybordy</title>
    <meta name="description" content="keybordy workbench: a local ESP32 simulator (a self-hosted fork of Velxio)." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070608" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist.var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/MartianMono.var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Anybody.var.woff2" crossorigin />
    <link rel="stylesheet" href="/keybordy/sticker.css" />
    <!-- Boot splash: painted before any JS loads and removed by
         src/lib/bootSplash.ts once the workspace is on screen. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(214, 255, 31, 0.09), transparent 42vmin),
          radial-gradient(rgba(185, 168, 255, 0.07) 1px, transparent 1.2px) 0 0 / 22px 22px,
          #070608;
        color: #e8e4ee;
        transition: opacity 380ms ease-in 120ms;
      }
      #boot-splash[data-state='leaving'] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash[data-state='leaving'] .kbs-wrap {
        animation: boot-peel-off 440ms cubic-bezier(0.55, 0, 0.8, 0.2) forwards;
      }
      @keyframes boot-peel-off {
        from { transform: rotate(-6deg); }
        30%  { transform: rotate(-9deg) scale(1.06); }
        to   { opacity: 0; transform: translate(34%, -60%) rotate(24deg) scale(0.7); }
      }
      .boot-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .boot-word {
        margin-top: 6px;
        font: 820 30px/1 'Anybody', 'Arial Black', Impact, sans-serif;
        font-stretch: 150%;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .boot-word span {
        display: inline-block;
        animation: boot-rise 520ms cubic-bezier(0.2, 1.4, 0.4, 1) both;
        animation-delay: calc(360ms + var(--i) * 40ms);
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(14px) rotate(6deg); }
      }
      .boot-keys {
        display: flex;
        gap: 6px;
      }
      .boot-keys i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: #1b1820;
        box-shadow: inset 0 -3px 0 #0c0b0e, 0 0 0 1px #2c2833;
        animation: boot-key 1.6s calc(700ms + var(--i) * 95ms) ease-out infinite;
      }
      @keyframes boot-key {
        0%, 26%, 100% { background: #1b1820; transform: translateY(0); }
        4%, 12% {
          background: var(--c);
          transform: translateY(2px);
          box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 0 14px var(--c);
        }
      }
      .boot-caption {
        font: 400 11px/1 'Martian Mono', 'SF Mono', Consolas, monospace;
        letter-spacing: 0.08em;
        color: #716a7c;
        text-transform: lowercase;
      }
      .boot-caption::after {
        content: '_';
        animation: boot-blink 1s steps(1) infinite;
      }
      @keyframes boot-blink {
        50% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-word span,
        .boot-keys i,
        .boot-caption::after,
        #boot-splash[data-state='leaving'] .kbs-wrap {
          animation: none;
        }
      }
    </style>
  </head>
  <!-- keybordy is dark only: data-theme is fixed on <html> above, and
       src/lib/theme.ts always resolves to dark. -->
  <body style="margin:0;background:var(--color-bg-canvas,#070608);">
    <div id="boot-splash" role="status" aria-label="Loading keybordy">
      <div class="boot-stack" aria-hidden="true">
        <!-- Same markup as src/components/ui/LogoSticker.tsx. -->
        <span class="kbs-wrap kbs-slap kbs--busy" style="width:128px;height:128px">
          <svg class="kbs" viewBox="0 0 100 100">
            <defs>
              <clipPath id="kbs-clip-boot"><rect x="4" y="4" width="92" height="92" rx="22" /></clipPath>
              <mask id="kbs-mask-boot"><rect width="100" height="100" fill="#fff" /><polygon points="100,72 72,100 100,100" fill="#000" /></mask>
              <linearGradient id="kbs-flap-boot" x1="86" y1="86" x2="76" y2="76" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9d95ab" /><stop offset="1" stop-color="#f4f1f8" /></linearGradient>
            </defs>
            <g mask="url(#kbs-mask-boot)">
              <rect class="kbs-vinyl" x="4" y="4" width="92" height="92" rx="22" />
              <rect class="kbs-cap-skirt" x="13" y="15" width="74" height="72" rx="15" />
              <g class="kbs-cap">
                <rect class="kbs-cap-top" x="13" y="13" width="74" height="64" rx="15" />
                <path d="M22 27q0-8 8-8h20" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5" stroke-linecap="round" />
                <g class="kbs-ink" transform="translate(50 45) scale(2.25) translate(-16.75 -16)">
                  <rect x="8.5" y="7.5" width="4.5" height="17" rx="1" />
                  <polygon points="13,15.2 19.6,7.5 25,7.5 16.4,17.6" />
                  <polygon points="15.2,15.6 25,24.5 19.6,24.5 13,18.6" />
                </g>
              </g>
              <g clip-path="url(#kbs-clip-boot)"><rect class="kbs-sheen" x="-50" y="-10" width="22" height="120" fill="#fff" /></g>
            </g>
            <g class="kbs-peel">
              <polygon points="96,76 76,96 73,73" fill="#000" fill-opacity=".28" />
              <path d="M96 76L76 96V79q0-3 3-3z" fill="url(#kbs-flap-boot)" />
            </g>
          </svg>
        </span>
        <div class="boot-word"><span style="--i:0">k</span><span style="--i:1">e</span><span style="--i:2">y</span><span style="--i:3">b</span><span style="--i:4">o</span><span style="--i:5">r</span><span style="--i:6">d</span><span style="--i:7">y</span></div>
        <div class="boot-keys"><i style="--i:0;--c:#d6ff1f"></i><i style="--i:1;--c:#ff2e74"></i><i style="--i:2;--c:#b9a8ff"></i><i style="--i:3;--c:#3ee6ff"></i><i style="--i:4;--c:#ffb52e"></i><i style="--i:5;--c:#d17bff"></i><i style="--i:6;--c:#5cffb0"></i><i style="--i:7;--c:#f4f1f8"></i></div>
        <div class="boot-caption">booting workbench</div>
      </div>
    </div>
    <script>
      // Never strand the page behind the splash if the app fails to boot.
      setTimeout(function () {
        var el = document.getElementById('boot-splash');
        if (el) el.remove();
      }, 15000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
