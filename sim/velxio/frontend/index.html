<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keybordy</title>
    <meta name="description" content="keybordy workbench: a local ESP32 simulator (a self-hosted fork of Velxio)." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070608" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist.var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/MartianMono.var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Anybody.var.woff2" crossorigin />
  </head>
  <!-- keybordy is dark only: data-theme is fixed on <html> above, and
       src/lib/theme.ts always resolves to dark. -->
  <body style="margin:0;background:var(--color-bg-canvas,#070608);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
