# Local Wokwi-style simulator: a fork of Velxio (AGPLv3) vendored in ./velxio,
# with the hosted-service parts (Pro walls, accounts, sharing, analytics)
# removed. Build it once: ./velxio/scripts/fetch-qemu.sh, then
#   docker compose -f sim/compose.yaml up -d --build
# Open http://localhost:3080/editor?project=keys8 — every folder under
# firmware/ with a diagram.json is a project, re-read on each page load.
name: keybordy-sim

services:
  velxio:
    build: ./velxio
    image: keybordy-velxio:local
    container_name: velxio
    ports:
      - "127.0.0.1:3080:80"
    volumes:
      - ../firmware:/srv/projects:ro
      - velxio-arduino-libs:/root/.arduino15
      - velxio-arduino-user-libs:/root/Arduino
      # ccache + persistent ESP-IDF build dir: warm ESP32 builds take seconds.
      - velxio-ccache:/var/cache/ccache
      - velxio-build:/var/lib/velxio-build
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  velxio-arduino-libs:
  velxio-arduino-user-libs:
  velxio-ccache:
  velxio-build:
